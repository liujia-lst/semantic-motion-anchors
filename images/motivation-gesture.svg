<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" width="480" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of the paper's semantic anchor example</title>
  <desc id="desc">Based on the textual example in Suresh et al., section 3.1, page 4: the speaker's right hand rises to chest level with open palm, emphasizing the increase described in speech. This is a schematic drawing, not a recorded gesture or an original paper figure.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#215694" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="open-hand">
      <path d="M-9 18L-16 7Q-19 2-16 0Q-13-2-9 4L-5 9L-7-12Q-7-17-4-17Q-1-17-1-13L1 0L1-21Q1-26 4-26Q7-26 7-21L8-1L10-18Q11-23 14-22Q17-21 16-17L14 2L17-10Q18-14 21-12Q23-11 22-7L18 13Q17 19 11 23L9 28L-4 27Z" fill="#f4f8fc" stroke="#215694" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <text x="62" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.7" fill="#617180">CONTEXT IN THE PAPER</text>
  <rect x="61" y="43" width="356" height="67" rx="14" fill="#fff" stroke="#cddbe7" stroke-width="1.5"/>
  <text x="239" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172d43"><tspan x="239">Increase described</tspan><tspan x="239" dy="25">in speech</tspan></text>
  <ellipse cx="260" cy="331" rx="105" ry="8" fill="#e7edf3"/>
  <!-- Front view: the speaker's right side is on the viewer's left. -->
  <path d="M261 207L259 218L235 226Q224 230 221 246L213 322H316L312 246Q310 230 298 226L278 218L277 207" fill="#e8f0f8" stroke="#617c96" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M261 210V221Q269 229 278 221V209" fill="#f7fafc" stroke="#617c96" stroke-width="2.5"/>
  <ellipse cx="270" cy="177" rx="28" ry="34" fill="#fff" stroke="#617c96" stroke-width="2.5"/>
  <path d="M244 167Q244 143 268 143Q290 142 297 167Q281 159 269 151Q258 165 244 167" fill="#d1dee9"/>
  <path d="M258 176H260M280 176H282M265 192Q271 196 277 191" fill="none" stroke="#617c96" stroke-width="2.5" stroke-linecap="round"/>
  <!-- The left arm rests; the right palm is shown at chest level. -->
  <path d="M306 239L329 282Q333 289 326 294L300 307" fill="none" stroke="#617c96" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M300 306L289 311" fill="none" stroke="#617c96" stroke-width="15" stroke-linecap="round"/>
  <path d="M300 306L289 311" fill="none" stroke="#f7fafc" stroke-width="10" stroke-linecap="round"/>
  <path d="M230 239L211 283Q207 289 202 282L177 258" fill="none" stroke="#215694" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 239L211 283Q207 289 202 282L177 258" fill="none" stroke="#d4e3f2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#open-hand" transform="translate(180 236) scale(-.82 .82)"/>
  <path d="M130 285V232" fill="none" stroke="#215694" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="160" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#617180">Right hand</text>
</svg>
